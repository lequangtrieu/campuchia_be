<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fancy Chatbox</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .chat-header {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .sent {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .received {
            background: #f1f0f0;
            align-self: flex-start;
        }

        .chat-footer {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .user-bar {
            padding: 10px;
            text-align: center;
            background: #eee;
        }

        .user-bar input {
            padding: 8px;
            margin: 0 5px;
            border-radius: 15px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🌐 Fancy Chatbox
    </div>

    <div class="user-bar">
        <input id="userId" placeholder="Your ID" />
        <input id="toUser" placeholder="Send to ID" />
        <button onclick="connect()">Connect</button>
    </div>

    <div class="chat-messages" id="messages">
        <!-- Messages go here -->
    </div>

    <div class="chat-footer">
        <input id="messageInput" type="text" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let socket;
    let currentUserId;

    function connect() {
        currentUserId = document.getElementById("userId").value;
        const toUser = document.getElementById("toUser").value;

        if (!currentUserId || !toUser) {
            alert("Please enter both your ID and recipient's ID.");
            return;
        }

        socket = new WebSocket(`ws://localhost:8000/ws/${currentUserId}`);

        socket.onopen = () => {
            console.log("Connected to WebSocket as:", currentUserId);
            showMessage("Connected to server.", "received");
        };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.error) {
                showMessage("Error: " + msg.error, "received");
            } else {
                const type = msg.from === currentUserId ? "sent" : "received";
                showMessage(`${msg.from}: ${msg.message}`, type);
            }
        };

        socket.onclose = () => {
            showMessage("Disconnected from server.", "received");
        };
    }

    function sendMessage() {
        const toUser = document.getElementById("toUser").value;
        const message = document.getElementById("messageInput").value;

        if (!message) return;

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ to: toUser, message }));
            showMessage(`${currentUserId}: ${message}`, "sent");
            document.getElementById("messageInput").value = "";
        } else {
            alert("Not connected to server.");
        }
    }

    function showMessage(message, type) {
        const messages = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${type}`;
        msgDiv.textContent = message;
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
